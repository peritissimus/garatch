[package]
name = "garatch-designer-core"
version = "0.1.0"
edition = "2024"
description = "WebAssembly core for generating standalone Garmin Connect IQ watch-face projects"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
