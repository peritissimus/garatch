      .tiny { font-family: Menlo, Consolas, monospace; font-size: 4px; fill: #fff; paint-order: stroke; stroke: #000; stroke-width: 1.5px; }
      .box { fill: none; stroke: #ff4fc3; stroke-width: .7; stroke-dasharray: 2 2; }
      .link { fill: none; stroke: #ff4fc3; stroke-width: .65; stroke-dasharray: 1.5 1.5; }
      .guide { fill: none; stroke: #33d6ff; stroke-width: .45; stroke-dasharray: 1 2; opacity: .8; }
      .measure { fill: none; stroke: #ffe55c; stroke-width: .55; marker-start: url(#arrow); marker-end: url(#arrow); }
